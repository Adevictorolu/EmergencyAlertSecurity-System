name: dualert
description: "An Emergency Alert Security System for Dominion University"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  firebase_core: ^3.7.0
  cloud_firestore: ^5.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_messaging: ^15.2.10
  firebase_auth: ^5.1.3
  geolocator: ^14.0.2
  location: ^6.0.0
  intl: ^0.18.1
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  flutter_svg: ^2.1.0
  gap: ^3.0.1
  shared_preferences: ^2.5.3
  firebase_storage: ^12.4.10
  flutter_sound: ^9.10.0
  path_provider: ^2.1.0
  permission_handler: ^11.4.0
  speech_to_text: ^6.6.0
  flutter_local_notifications: ^17.1.2
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  #   To add assets to your application, add an assets section, like this:
  assets:
    - assets/imgs/1.png
    - assets/imgs/2.png
    - assets/imgs/3.png
    - assets/imgs/DUALERT BRAND copy.jpg

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Thin.ttf
          style: normal
          weight: 100
        - asset: assets/fonts/Montserrat-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: assets/fonts/Montserrat-ExtraLight.ttf
          style: normal
          weight: 200
        - asset: assets/fonts/Montserrat-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: assets/fonts/Montserrat-Light.ttf
          style: normal
          weight: 300
        - asset: assets/fonts/Montserrat-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/fonts/Montserrat-Regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          style: normal
          weight: 500
        - asset: assets/fonts/Montserrat-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          style: normal
          weight: 600
        - asset: assets/fonts/Montserrat-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          style: normal
          weight: 700
        - asset: assets/fonts/Montserrat-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          style: normal
          weight: 800
        - asset: assets/fonts/Montserrat-ExtraBoldItalic.ttf
          style: italic
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          style: normal
          weight: 900
        - asset: assets/fonts/Montserrat-BlackItalic.ttf
          style: italic
          weight: 900

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
